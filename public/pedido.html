<!DOCTYPE html>
<html lang="es" data-theme="nocturno">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12110f" />
  <title>HEXA · Pedido listo</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <script src="/js/platform-boot.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/platform.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="/"><span class="mark">H</span><b>HEXA</b></a>
      <nav class="nav">
        <a href="/">Catálogo</a>
        <a href="/checkout.html">Pedido</a>
        <a href="/pedidos.html">Pedidos</a>
      </nav>
    </div>
  </header>
  <main class="wrap" style="padding:36px 0 80px" id="ok"></main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/hexa-api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/platform.js"></script>
  <script src="/js/carrito.js"></script>
  <script src="/js/ruta.js"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(location.search).get("id");
      const pagos = { efectivo: "Efectivo contra entrega", transferencia: "Transferencia", tarjeta: "Tarjeta al recibir" };
      try {
        const p = await HexaAPI.pedido(id);
        const gps = HexaRuta.pedidoConGps(p);
        const lat = Number(p.lat);
        const lng = Number(p.lng);
        document.getElementById("ok").innerHTML = `<div class="kicker">Pedido #${p.id}</div>
           <h1>Listo, ${p.nombre}</h1>
           <p class="lede">Total ${money(p.total)} · ${pagos[p.metodo_pago] || p.metodo_pago}.</p>
           <div class="card" style="padding:16px">
             ${(p.items || []).map((i) => `<div class="row"><span>${i.producto_nombre} (${i.estilo_nombre}) × ${i.cantidad}</span><span>${money(i.precio_unitario * i.cantidad)}</span></div>`).join("")}
             <p class="hint">${gps ? "Incluye ubicación GPS para el envío." : "Sin GPS. Dirección: " + (p.direccion || "—")}</p>
             ${
               gps
                 ? `<iframe class="mapa-entrega" title="Destino de entrega" src="${HexaRuta.urlMapsEmbed(lat, lng)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    <div class="qty" style="margin-top:12px">
                      <a class="btn con-ico" href="${HexaRuta.urlMapsDestino(lat, lng)}" target="_blank" rel="noopener">${window.hexaIco ? hexaIco("ruta") : ""}<span>Ir en Maps</span></a>
                      <button type="button" class="ghost con-ico" id="add-parada">${window.hexaIco ? hexaIco("plus") : ""}<span>Agregar parada</span></button>
                      <a class="ghost con-ico" href="${HexaRuta.urlMapsPunto(lat, lng)}" target="_blank" rel="noopener">${window.hexaIco ? hexaIco("pin") : ""}<span>Ver punto</span></a>
                    </div>
                    <p class="hint" id="msg-ruta">La ruta sale de tu ubicación actual. Esta entrega queda como destino, o como nueva parada si ya hay otras.</p>`
                 : ""
             }
           </div>
           <p style="margin-top:18px"><a class="btn" href="/pedidos.html">Ver pedidos</a></p>`;
        document.getElementById("add-parada")?.addEventListener("click", () => {
          try {
            const ruta = HexaRuta.agregarParada(p);
            const msg = document.getElementById("msg-ruta");
            msg.textContent = `Parada ${ruta.length} agregada. El destino ahora es ${p.nombre}.`;
            msg.className = "hint ok";
            const ir = document.querySelector('a[href*="maps/dir"]');
            if (ir) ir.href = HexaRuta.urlMapsRuta(ruta);
          } catch (err) {
            alert(err.message);
          }
        });
      } catch {
        document.getElementById("ok").innerHTML = `<p class="empty">No encontramos ese pedido.</p>`;
      }
    })();
  </script>
</body>
</html>
