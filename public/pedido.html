<!DOCTYPE html>
<html lang="es" data-theme="nocturno">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12110f" />
  <title>HEXA · Pedido listo</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <script src="/js/platform-boot.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/platform.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="/"><span class="mark">H</span><b>HEXA</b></a>
      <nav class="nav">
        <a href="/">Catálogo</a>
        <a href="/checkout.html">Pedido</a>
        <a href="/pedidos.html">Pedidos</a>
      </nav>
    </div>
  </header>
  <main class="wrap" style="padding:36px 0 80px" id="ok"></main>
  <script src="/js/theme.js"></script>
  <script src="/js/platform.js"></script>
  <script src="/js/carrito.js"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(location.search).get("id");
      const res = await fetch("/api/pedidos/" + id);
      const p = await res.json();
      const pagos = { efectivo: "Efectivo contra entrega", transferencia: "Transferencia", tarjeta: "Tarjeta al recibir" };
      document.getElementById("ok").innerHTML = res.ok
        ? `<div class="kicker">Pedido #${p.id}</div>
           <h1>Listo, ${p.nombre}</h1>
           <p class="lede">Total ${money(p.total)} · ${pagos[p.metodo_pago] || p.metodo_pago}.</p>
           <div class="card" style="padding:16px">
             ${p.items.map((i) => `<div class="row"><span>${i.producto_nombre} (${i.estilo_nombre}) × ${i.cantidad}</span><span>${money(i.precio_unitario * i.cantidad)}</span></div>`).join("")}
             <p class="hint">${p.permiso_ubicacion ? "Incluye ubicación GPS para el envío." : "Sin GPS. Dirección: " + (p.direccion || "—")}</p>
           </div>
           <p style="margin-top:18px"><a class="btn" href="/">Seguir viendo</a></p>`
        : `<p class="empty">No encontramos ese pedido.</p>`;
    })();
  </script>
</body>
</html>
