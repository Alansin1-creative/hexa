<!DOCTYPE html>
<html lang="es" data-theme="nocturno">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12110f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HEXA" />
  <title>HEXA · Catálogo</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;650;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="/js/platform-boot.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/platform.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="/"><span class="mark">H</span><b>HEXA</b></a>
      <nav class="nav">
        <a class="active" href="/">Catálogo</a>
        <a href="/checkout.html">Pedido</a>
        <a href="/admin.html">Inventario</a>
        <a href="/pedidos.html">Pedidos</a>
      </nav>
      <div class="themes" aria-label="Estilos visuales">
        <button class="dot" data-theme-btn="nocturno" title="Nocturno"></button>
        <button class="dot" data-theme-btn="atelier" title="Atelier"></button>
        <button class="dot" data-theme-btn="neon" title="Neón"></button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <div class="kicker">Seis caras · un objeto</div>
      <h1>Productos que giran cuando tienes todas las fotos.</h1>
      <p class="lede">Sube o toma fotos de frente, atrás, lados, arriba y abajo para armar un cubo 3D. Si faltan ángulos, el artículo se muestra en galería 2D.</p>
    </section>
    <div class="toolbar">
      <input id="buscar" type="search" placeholder="Buscar producto o categoría" />
      <button class="chip active" type="button" data-filtro="todos">Todos</button>
      <button class="chip" type="button" data-filtro="3d">Solo 3D</button>
      <button class="chip" type="button" data-filtro="2d">Solo 2D</button>
    </div>
    <section class="grid" id="catalogo"></section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/hexa-api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/platform.js"></script>
  <script src="/js/carrito.js"></script>
  <script src="/js/catalogo.js"></script>
</body>
</html>
