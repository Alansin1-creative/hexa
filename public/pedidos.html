<!DOCTYPE html>
<html lang="es" data-theme="nocturno">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12110f" />
  <title>HEXA · Pedidos</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <script src="/js/platform-boot.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/platform.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="/"><span class="mark">H</span><b>HEXA</b></a>
      <nav class="nav">
        <a href="/">Catálogo</a>
        <a href="/admin.html">Inventario</a>
        <a class="active" href="/pedidos.html">Pedidos</a>
        <a href="/ganancias.html">Ganancias</a>
      </nav>
      <div class="themes">
        <button class="dot" data-theme-btn="nocturno"></button>
        <button class="dot" data-theme-btn="atelier"></button>
        <button class="dot" data-theme-btn="neon"></button>
      </div>
    </div>
  </header>
  <main class="wrap" style="padding:36px 0 80px">
    <section class="hero" style="padding-top:8px">
      <div class="kicker">Tienda</div>
      <div class="row">
        <div>
          <h1>Pedidos de clientes</h1>
          <p class="lede">Los pedidos llegan aquí cuando alguien confirma en la tienda. El botón carga en Maps una ruta desde tu ubicación hasta cada GPS.</p>
        </div>
        <button type="button" class="btn con-ico" id="cargar-ruta-maps">Cargar ruta en Maps</button>
      </div>
    </section>
    <div class="card ruta-panel" id="ruta-panel"></div>
    <div class="card" style="padding:8px 16px 16px; overflow:auto">
      <table id="tabla"></table>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/hexa-api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/platform.js"></script>
  <script src="/js/carrito.js"></script>
  <script src="/js/ruta.js?v=11"></script>
  <script>
    function puntosGps(pedidos) {
      return (pedidos || [])
        .filter((p) => Number.isFinite(Number(p.lat)) && Number.isFinite(Number(p.lng)))
        .sort((a, b) => Number(a.id) - Number(b.id));
    }
    function abrirRutaMaps(pedidos) {
      const pts = puntosGps(pedidos).map((p) => `${Number(p.lat)},${Number(p.lng)}`);
      if (!pts.length) {
        alert("Ningún pedido tiene GPS todavía.");
        return;
      }
      if (window.HexaRuta) {
        HexaRuta.armarDesdePedidos(pedidos);
        HexaRuta.cargarEnMaps();
        return;
      }
      window.open(`https://www.google.com/maps/dir/Current+Location/${pts.join("/")}`, "_blank", "noopener");
    }
    (async () => {
      const panel = document.getElementById("ruta-panel");
      const btn = document.getElementById("cargar-ruta-maps");
      let d = [];
      try {
        d = await HexaAPI.pedidos();
      } catch (err) {
        document.getElementById("tabla").innerHTML = `<tbody><tr><td>${err.message}</td></tr></tbody>`;
        return;
      }
      btn?.addEventListener("click", () => abrirRutaMaps(d));
      if (window.HexaRuta) HexaRuta.pintarPanelRuta(panel, d);
      document.getElementById("tabla").innerHTML = `
        <thead><tr><th>#</th><th>Cliente</th><th>Teléfono</th><th>Pago</th><th>GPS</th><th>Total</th><th>Fecha</th></tr></thead>
        <tbody>${
          d.length
            ? d.map((p) => {
                const gps = window.HexaRuta ? HexaRuta.pedidoConGps(p) : Number.isFinite(Number(p.lat));
                const lat = Number(p.lat);
                const lng = Number(p.lng);
                return `<tr>
                <td><a href="/pedido.html?id=${p.id}">${p.id}</a></td>
                <td>${p.nombre}</td><td>${p.telefono}</td><td>${p.metodo_pago}</td>
                <td>${
                  gps
                    ? `<div class="gps-acciones">
                        <a class="ghost" href="https://www.google.com/maps/dir/Current+Location/${lat},${lng}" target="_blank" rel="noopener">${lat.toFixed(4)}, ${lng.toFixed(4)}</a>
                        <button type="button" class="ghost" data-parada="${p.id}">Parada</button>
                      </div>`
                    : "no"
                }</td>
                <td>${money(p.total)}</td><td>${p.creado_en}</td>
              </tr>`;
              }).join("")
            : `<tr><td colspan="7">Aún no hay pedidos.</td></tr>`
        }</tbody>`;
      const porId = Object.fromEntries(d.map((p) => [String(p.id), p]));
      document.querySelectorAll("[data-parada]").forEach((el) => {
        el.addEventListener("click", () => {
          try {
            if (window.HexaRuta) {
              HexaRuta.agregarParada(porId[el.dataset.parada]);
              HexaRuta.pintarPanelRuta(panel, d);
            }
            el.textContent = "En ruta";
          } catch (err) {
            alert(err.message);
          }
        });
      });
    })();
  </script>
</body>
</html>
